x-config:
  &project-env
  GRPC_ENDPOINT: "radar-grpc:5555" # grpc
  PGHOST : "radar-pg"              # grpc
  PGPORT : "5432"                  # grpc
  PGDATABASE : "postgres"          # grpc
  PGUSER: "postgres"               # grpc
  PGPASSWORD: "password"           # grpc
  PGOPTIONS : '--client-min-messages=warning'
  POSTGRES_PASSWORD: password

networks:
  esmira_net:
    name: esmira_net
    external: false

services:

  # ----------------------------------------------- 0. PG -- ;
  radar-pg:
    platform: linux/amd64
    container_name: radar-pg
    pull_policy: never
    build:
      context: "./docker/postgres"
      dockerfile: "./Dockerfile"
    image: radar-pg:postgres-16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: no
    user: root
    networks:
      - esmira_net
    expose:
      - "5432"
    environment:
      <<: *project-env


  # --------------------------------------------- 1. GRPC -- ;
  radar-grpc:
    depends_on:
      radar-pg:
        condition: service_healthy
    container_name: radar-grpc
    platform: linux/amd64
    pull_policy: never
    build:
      context: "./docker/hellogrpc"
      dockerfile: "./Dockerfile"
    image: radar-grpc:golang-1.24
    expose:
      - "5555"
    restart: no
    user: root
    networks:
      - esmira_net
    environment:
      <<: *project-env


  # ---------------------------------------------- 2. API -- ;
  radar-api:
    depends_on:
      radar-pg:
        condition: service_healthy
      radar-grpc:
        condition: service_started
    container_name: radar-api
    platform: linux/amd64
    build:
      context: "./docker/api"
      dockerfile: "./Dockerfile"
    image: radar-api:python-3.10
    pull_policy: never
    ports:
      - "8080:8080"
    restart: no
    user: root
    networks:
      - esmira_net
    environment:
      <<: *project-env


  # ------------------------------------------- FINAL. UI -- ;
  radar-ui:
    depends_on:
      radar-pg:
        condition: service_healthy
      radar-grpc:
        condition: service_started
      radar-api:
        condition: service_started
    platform: linux/amd64
    pull_policy: never
    build:
      context: "./docker/ui"
      dockerfile: "./Dockerfile"    
    container_name: radar-ui
    image: radar-ui:node-18
    restart: no
    user: root
    networks:
      - esmira_net
    ports:
      - "4200:80"
    environment:
      <<: *project-env

